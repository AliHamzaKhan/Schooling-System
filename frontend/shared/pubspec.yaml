name: shared
description: "A new Flutter package project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.10.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # State management + DI (used across services, layout, and all features).
  get: ^4.6.6
  # Icon set — single source of truth for iconography (see AppIcons) so the
  # school & admin portals render bolder, more legible icons than Material's.
  font_awesome_flutter: ^11.0.0
  # HTTP gateway (ApiService).
  http: ^1.2.2
  # Local persistence (DataStoreService).
  # v10+ adds Swift Package Manager (SPM) support for iOS/macOS.
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  flutter_local_notifications: ^22.0.1
  local_auth: ^3.0.1
  permission_handler: ^12.0.3

  # NOTE: heavier modules pasted under lib/src (notifications/biometric/
  # permissions/version) also need firebase_core, firebase_messaging,
  # flutter_local_notifications, local_auth and permission_handler. Add those
  # when those modules are exported/used.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
