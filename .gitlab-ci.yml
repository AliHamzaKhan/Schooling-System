# =============================================================================
# GitLab CI/CD — backend deploy and Flutter release gates.
#
# One-time setup (see backend/deploy/README.md for the full checklist):
#   - Create `school_db` in the shared postgres.
#   - Create `/opt/apps/school/backend` and `/opt/storage/projects/school`
#     on the VPS (chown 999:999 for uploads).
#   - Add the CI/CD variables listed in backend/deploy/README.md
#     (mask + protect all secrets).
#   - Point school.ahkstudios.com A record at 161.97.98.16 and add an NPM
#     proxy host: /api/* -> school-backend:8000 over app-network.
# =============================================================================

stages: [lint, test, build, deploy]

variables:
  IMAGE: $CI_REGISTRY_IMAGE/backend
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

# Flutter is pinned to the SDK revision recorded by all three front-end
# projects. Update this tag deliberately with the projects' SDK constraints.
.flutter:
  image: ghcr.io/cirruslabs/flutter:3.44.1
  variables:
    PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  cache:
    key:
      files:
        - frontend/shared/pubspec.lock
        - frontend/school_portal/pubspec.lock
        - frontend/admin_portal/pubspec.lock
    paths: [.pub-cache/]

.frontend_rules: &frontend_rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: [frontend/**/*, .gitlab-ci.yml]
  - if: '$CI_COMMIT_BRANCH == "main"'
    changes: [frontend/**/*, .gitlab-ci.yml]

# --------------------------------------------------------------------------- #
# Backend (FastAPI) — runs from the backend/ directory
# --------------------------------------------------------------------------- #
.backend:
  image: python:3.12-slim
  cache:
    key: backend-pip
    paths: [.pip-cache/]
  before_script:
    - cd backend
    - pip install -r requirements-dev.txt

backend:lint:
  extends: .backend
  stage: lint
  script:
    # Pin ruff — an unpinned install lets a newer release fail lint on
    # unchanged code (newly-stabilised rules), blocking deploys.
    - pip install "ruff==0.13.0"
    - ruff check app
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [backend/**/*]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [backend/**/*]

secret:scan:
  stage: lint
  image: python:3.12-slim
  script:
    # The scanner emits only file/line/category, never matched values.
    - python backend/scripts/scan_tracked_secrets.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

backend:dependency-audit:
  stage: lint
  image: python:3.12-slim
  script:
    # Pinned scanner; advisory data is fetched at run time and a finding fails
    # the job. The requirement file includes the production dependencies.
    - pip install --no-cache-dir "pip-audit==2.9.0"
    - pip-audit --strict --progress-spinner off -r backend/requirements-dev.txt
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [backend/**/*, .gitlab-ci.yml]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [backend/**/*, .gitlab-ci.yml]

frontend:dependency-audit:
  stage: lint
  image: python:3.12-slim
  script:
    - python backend/scripts/audit_pub_dependencies.py
  rules: *frontend_rules

backend:test:
  extends: .backend
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: schooling_test
  script:
    # Force test DB + secrets — must be exported in-script because GitLab
    # project-level variables (DATABASE_URL, JWT_SECRET_KEY, REDIS_URL) win
    # over job-level `variables:` and would otherwise point tests at prod.
    - export SCHOOLING_TEST_ADMIN_URL="postgresql+asyncpg://postgres:postgres@postgres:5432/postgres"
    - export JWT_SECRET_KEY="ci-test-secret-not-used-in-prod"
    - export REDIS_URL=""
    - export ENVIRONMENT="test"
    - python scripts/run_isolated_tests.py -- -q
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [backend/**/*]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [backend/**/*]

backend:migration-rehearsal:
  extends: .backend
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: schooling_test
  script:
    # The isolated runner creates a disposable restricted role/database. This
    # tests upgrade/downgrade the outbox and worker-heartbeat migrations in
    # their own disposable schemas.
    - export SCHOOLING_TEST_ADMIN_URL="postgresql+asyncpg://postgres:postgres@postgres:5432/postgres"
    - export JWT_SECRET_KEY="ci-test-secret-not-used-in-prod"
    - export REDIS_URL=""
    - export ENVIRONMENT="test"
    - python scripts/run_isolated_tests.py -- -q tests/test_outbox_migration.py tests/test_worker_heartbeat_migration.py tests/test_storage_quota.py
    # Full chain rollback drill on the empty service database: every revision
    # must upgrade, downgrade to base and upgrade again.
    - export DATABASE_URL="postgresql+asyncpg://postgres:postgres@postgres:5432/schooling_test"
    - alembic upgrade head && alembic downgrade base && alembic upgrade head
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [backend/**/*, .gitlab-ci.yml]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [backend/**/*, .gitlab-ci.yml]

backend:critical-journeys:
  extends: .backend
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: schooling_test
  script:
    # Named release gate: API contract plus the highest-risk cross-layer flows.
    - export SCHOOLING_TEST_ADMIN_URL="postgresql+asyncpg://postgres:postgres@postgres:5432/postgres"
    - export JWT_SECRET_KEY="ci-test-secret-not-used-in-prod"
    - export REDIS_URL=""
    - export ENVIRONMENT="test"
    - python scripts/run_isolated_tests.py -- -q tests/test_api_contract.py tests/test_auth.py tests/test_session_device_lifecycle.py tests/test_payment_concurrency.py tests/test_payment_idempotency.py tests/test_private_downloads.py tests/test_broadcast_isolation.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [backend/**/*, .gitlab-ci.yml]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [backend/**/*, .gitlab-ci.yml]

# --------------------------------------------------------------------------- #
# Frontend (Flutter) — validate every affected package before a release build.
# `shared` is a library, so it has no independently deployable web artifact.
# Both portals are compiled in production mode with an explicit public API URL;
# the build never contacts that URL or requires a production credential.
# --------------------------------------------------------------------------- #
frontend:shared:lint:
  extends: .flutter
  stage: lint
  script:
    - cd frontend/shared
    - flutter pub get
    # Existing informational/warning debt is reported, while errors fail the
    # release gate. Promote those findings after the recorded baseline cleanup.
    - flutter analyze --no-fatal-infos --no-fatal-warnings
  rules: *frontend_rules

frontend:school:lint:
  extends: .flutter
  stage: lint
  script:
    - cd frontend/school_portal
    - flutter pub get
    - flutter analyze --no-fatal-infos --no-fatal-warnings
  rules: *frontend_rules

frontend:admin:lint:
  extends: .flutter
  stage: lint
  script:
    - cd frontend/admin_portal
    - flutter pub get
    - flutter analyze --no-fatal-infos --no-fatal-warnings
  rules: *frontend_rules

frontend:shared:test:
  extends: .flutter
  stage: test
  script:
    - cd frontend/shared
    - flutter pub get
    - flutter test
  rules: *frontend_rules

# Browser-only code (Web Locks, localStorage, JS integer semantics) is not
# exercised by the VM tests above; a web sign-in regression shipped unseen.
frontend:shared:browser-test:
  extends: .flutter
  stage: test
  script:
    - apt-get update -qq && apt-get install -y -qq chromium > /dev/null
    - export CHROME_EXECUTABLE="$(command -v chromium)"
    - cd frontend/shared
    - flutter pub get
    - flutter test --platform chrome test/session_coordination_browser_test.dart
  rules: *frontend_rules

frontend:school:test:
  extends: .flutter
  stage: test
  script:
    - cd frontend/school_portal
    - flutter pub get
    - flutter test
  rules: *frontend_rules

frontend:admin:test:
  extends: .flutter
  stage: test
  script:
    - cd frontend/admin_portal
    - flutter pub get
    - flutter test
  rules: *frontend_rules

frontend:school:build:web:
  extends: .flutter
  stage: build
  script:
    - cd frontend/school_portal
    - flutter pub get
    - flutter build web --release --dart-define=APP_ENV=production --dart-define=API_BASE_URL=https://school.ahkstudios.com/api/v1
  artifacts:
    paths: [frontend/school_portal/build/web]
    expire_in: 1 day
  rules: *frontend_rules

frontend:admin:build:web:
  extends: .flutter
  stage: build
  script:
    - cd frontend/admin_portal
    - flutter pub get
    - flutter build web --release --dart-define=APP_ENV=production --dart-define=API_BASE_URL=https://school.ahkstudios.com/api/v1
  artifacts:
    paths: [frontend/admin_portal/build/web]
    expire_in: 1 day
  rules: *frontend_rules

backend:build:
  stage: build
  image: docker:27
  services: ["docker:27-dind"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" backend
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [backend/**/*]

backend:deploy:prod:
  stage: deploy
  image: alpine:3.20
  variables:
    APP_DIR: /opt/apps/school/backend
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # 1) Prepare directories on the VPS.
    - ssh $SSH_USER@$SSH_HOST "mkdir -p $APP_DIR /opt/storage/projects/school"

    # 2) Ship the compose file.
    - scp backend/deploy/docker-compose.prod.yml $SSH_USER@$SSH_HOST:$APP_DIR/docker-compose.yml

    # 3) Build .env locally, then scp it (avoids fragile heredoc-over-ssh quoting).
    - |
      : "${DATABASE_URL:?Set protected DATABASE_URL before production deploy}"
      : "${REDIS_URL:?Set protected REDIS_URL before production deploy}"
      : "${JWT_SECRET_KEY:?Set protected JWT_SECRET_KEY before production deploy}"
      : "${FIRST_SUPERADMIN_EMAIL:?Set protected FIRST_SUPERADMIN_EMAIL before production deploy}"
      : "${FIRST_SUPERADMIN_PASSWORD:?Set protected FIRST_SUPERADMIN_PASSWORD before production deploy}"
      : "${BACKEND_CORS_ORIGINS:?Set protected BACKEND_CORS_ORIGINS before production deploy}"
      : "${UPLOAD_SCANNER_BACKEND:?Set protected UPLOAD_SCANNER_BACKEND=clamav before production deploy}"
      : "${UPLOAD_SCANNER_HOST:?Set protected UPLOAD_SCANNER_HOST before production deploy}"
      cat > /tmp/school.env <<EOF
      ENVIRONMENT=production
      IMAGE=$IMAGE
      IMAGE_TAG=$CI_COMMIT_SHORT_SHA
      DATABASE_URL=$DATABASE_URL
      REDIS_URL=$REDIS_URL
      JWT_SECRET_KEY=$JWT_SECRET_KEY
      ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FIRST_SUPERADMIN_EMAIL=$FIRST_SUPERADMIN_EMAIL
      FIRST_SUPERADMIN_PASSWORD=$FIRST_SUPERADMIN_PASSWORD
      BACKEND_CORS_ORIGINS=$BACKEND_CORS_ORIGINS
      STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR=/app/uploads
      UPLOAD_SCANNER_BACKEND=$UPLOAD_SCANNER_BACKEND
      UPLOAD_SCANNER_HOST=$UPLOAD_SCANNER_HOST
      UPLOAD_SCANNER_PORT=${UPLOAD_SCANNER_PORT:-3310}
      UPLOAD_SCANNER_TIMEOUT_SECONDS=${UPLOAD_SCANNER_TIMEOUT_SECONDS:-15}
      LOG_FORMAT=json
      TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM:-}
      TWILIO_SMS_FROM=${TWILIO_SMS_FROM:-}
      FCM_SERVER_KEY=${FCM_SERVER_KEY:-}
      FIREBASE_CREDENTIALS_JSON_B64=${FIREBASE_CREDENTIALS_JSON_B64:-}
      EMAIL_FROM=${EMAIL_FROM:-}
      ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      EOF
    - scp /tmp/school.env $SSH_USER@$SSH_HOST:$APP_DIR/.env
    - ssh $SSH_USER@$SSH_HOST "chmod 600 $APP_DIR/.env"

    # 4) Log in to the registry ON the VPS (the job token is still valid here),
    #    then pull + restart.
    - |
      ssh $SSH_USER@$SSH_HOST "
        set -e
        cd $APP_DIR
        docker login -u '$CI_REGISTRY_USER' -p '$CI_REGISTRY_PASSWORD' '$CI_REGISTRY'
        docker compose pull
        docker compose up -d
        docker compose ps
      "

    # 5) Readiness check — retry while migrations + seed run.
    - |
      ssh $SSH_USER@$SSH_HOST "
        for i in \$(seq 1 20); do
          if docker exec school-backend python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/health/ready\").status==200 else 1)'; then
            echo 'Readiness check OK'; exit 0
          fi
          echo \"Waiting for backend (\$i/20)...\"; sleep 5
        done
        echo 'Readiness check FAILED'; docker logs --tail 200 school-backend; exit 1
      "
  environment:
    name: production
    url: https://school.ahkstudios.com/api
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
